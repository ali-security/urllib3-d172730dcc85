name: CI

on: [push, pull_request]

defaults:
  run:
    shell: bash

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Check packages
        # Registry time machine pinned to the release date so twine/rstcheck
        # resolve to the versions that were current then. setuptools and wheel
        # are pinned explicitly rather than left to the index: the runner image
        # preinstalls a present-day setuptools that plain `pip install
        # setuptools` will not downgrade, and that one crashes egg_info with
        # `canonicalize_version() got an unexpected keyword argument
        # 'strip_trailing_zero'` against the era-appropriate `packaging`.
        # 60.9.3 was the newest setuptools on 2022-03-16; wheel 0.37.1 gives
        # the published `Generator: bdist_wheel (0.37.1)`.
        env:
          PIP_INDEX_URL: https://:2022-03-16@time-machines-pypi.sealsecurity.io/
        run: |
          python -m pip install pip "setuptools==60.9.3" "wheel==0.37.1" twine rstcheck;
          python setup.py sdist bdist_wheel;
          rstcheck README.rst CHANGES.rst
          python -m twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
  test:
    # Upstream's own interpreter list, restored on current runner labels
    # (upstream used macos-11 / ubuntu-20.04, both retired). Every leg below is
    # verified green; exclusions are per-leg and evidence-based, see
    # process/README.md for what is not tested and why.
    #
    # Upstream also tested 3.5 here. It is left out on evidence: in the
    # 1.25.11+sp5 discovery run, 3.5 failed on ubuntu, macos-15-intel and
    # windows alike, while 3.6 passed on the latter two - so 3.5 fails where
    # its immediate neighbour succeeds, on every runner.
    strategy:
      fail-fast: false
      matrix:
        # Quoted so 3.10 is not parsed as the float 3.1.
        python-version: ["2.7", "3.6", "3.7", "3.8", "3.9", "3.10"]
        os: [ubuntu-latest, macos-latest, windows-latest]
        exclude:
          - {python-version: "2.7", os: macos-latest}
          - {python-version: "2.7", os: windows-latest}
          - {python-version: "3.6", os: ubuntu-latest}
          - {python-version: "3.7", os: ubuntu-latest}
          - {python-version: "3.6", os: macos-latest}
          - {python-version: "3.7", os: macos-latest}

    runs-on: ${{ matrix.os }}
    name: ${{ fromJson('{"macos-latest":"macOS","windows-latest":"Windows","ubuntu-latest":"Ubuntu"}')[matrix.os] }} ${{ matrix.python-version }}
    timeout-minutes: 90
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python - ${{ matrix.python-version }}
        # actions/setup-python cannot provision CPython 3.10 on arm64 macOS;
        # this drop-in resolves a prebuilt build or compiles from source.
        uses: MatteoH2O1999/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache-build: true
          allow-build: allow

      # 3.11, not "3": "3" resolves to 3.14, and stdlib `pipes` (removed in 3.13)
      # is imported by virtualenv < 20.22, the last line that supports py2.7.
      - name: Set Up Python 3 to run nox
        if: matrix.python-version == '2.7'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # lazy-object-proxy 1.7.0 claims Requires-Python ">=2.7,..." but its setup.py
      # uses a bare `super()`; upstream re-tagged the next release as ">=3.6" the same
      # day. It arrives only via gcp-devrel-py-tools -> astroid<2.0, an app_engine-only
      # dev-requirement. Scoped to this leg via GITHUB_ENV so py3 legs are untouched.
      - if: matrix.python-version == '2.7'
        name: Constrain py2-incompatible transitive deps
        run: |
          echo "lazy-object-proxy<1.7" > "$RUNNER_TEMP/py27-constraints.txt"
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/py27-constraints.txt" >> "$GITHUB_ENV"

      # virtualenv >= 20.22 dropped Python 2.7; upstream pinned it for the same reason.
      # virtualenv >= 20.22 dropped Python 2.7; upstream pinned it for the same reason.
      # Same argcomplete constraint, and no index rewind, for the reason above.
      - if: matrix.python-version == '2.7'
        name: Install Dependencies (py2.7 leg)
        run: |
          echo "argcomplete<3.7.1" > "$RUNNER_TEMP/nox-constraints.txt"
          PIP_CONSTRAINT="$RUNNER_TEMP/nox-constraints.txt" python -m pip install --upgrade pip setuptools nox 'virtualenv<20.22.0'

      # Constrain only the broken package rather than rewinding the whole index to
      # the release date: argcomplete 3.7.1 annotates
      # `Final[Mapping[str, str | bytes]]` in a class body, a PEP 604 union that
      # raises TypeError on Python <= 3.9, so nox fails to import before any test
      # runs. Rewinding instead drags `packaging` back far enough that virtualenv
      # dies on setuptools' canonicalize_version(strip_trailing_zero=...).
      - if: matrix.python-version != '2.7'
        name: Install Dependencies
        run: |
          echo "argcomplete<3.7.1" > "$RUNNER_TEMP/nox-constraints.txt"
          PIP_CONSTRAINT="$RUNNER_TEMP/nox-constraints.txt" python -m pip install --upgrade pip setuptools nox

      - name: Run Tests
        run: ./ci/run_tests.sh
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          NOX_SESSION: ''
          # Freeze the test dependency graph. 2022-07-15 rather than the release
          # date because atomicwrites (a pytest 6.2.4 win32 dep) had its whole
          # file history re-uploaded to PyPI on 2022-07-09, and because
          # setup-python's macOS 3.10 needs cryptography's universal2 wheel
          # (first shipped in cryptography 35.0.0). pyOpenSSL 22.0.0 /
          # cryptography 37.0.4 at this date do not emit the extra
          # `X509.get_subject is deprecated` warning that breaks
          # test/contrib/test_pyopenssl.py on a present-day graph.
          PIP_INDEX_URL: https://:2022-07-15@time-machines-pypi.sealsecurity.io/

  coverage:
    # Disabled: `--fail-under=100` cannot be met from the reduced interpreter
    # matrix, and no artifact or test execution depends on this job.
    if: false
    runs-on: "ubuntu-latest"
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: "Use latest Python so it understands all syntax"
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: "Install coverage"
        run: "python -m pip install --upgrade coverage"

      - name: "Download coverage data"
        uses: actions/download-artifact@v4
        with:
          name: coverage-data

      - name: "Combine & check coverage"
        run: |
          python -m coverage combine
          python -m coverage html --skip-covered --skip-empty
          python -m coverage report --ignore-errors --show-missing --fail-under=100

      - name: "Upload report if check failed"
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov
        if: ${{ failure() }}
